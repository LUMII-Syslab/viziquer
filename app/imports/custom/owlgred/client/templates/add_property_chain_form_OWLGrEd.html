<template name="AddPropertyChain_OWLGrEd">
<style>
.table-container {
  margin: 20px;
  font-family: Arial, sans-serif;
}

#property-table {
  width: 100%;
  margin-bottom: 15px;
  border-collapse: collapse;
}

#property-table th {
  background-color: #f8f9fa;
  padding: 10px;
  text-align: left;
}

#property-table td {
  padding: 8px;
  border: 1px solid #dee2e6;
}

.property-select {
  width: 100%;
  padding: 6px;
  border: 1px solid #ced4da;
  border-radius: 4px;
}

.is-inverse-checkbox {
  width: 24px;
  height: 24px;
  cursor: pointer;

  /* override theme styles that hide checkboxes */
  display: inline-block !important;
  opacity: 1 !important;
  position: static !important;
  margin: 0;         /* optional: keeps it centered nicely */
}

.delete-btn {
  padding: 5px 10px;
}

#add-row-btn {
  padding: 6px 12px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

#add-row-btn:hover {
  background-color: #0069d9;
}
</style>
  {{#with key_obj}}
	<!-- Modal for new document -->
    <div id="add-property-chain-form-owlgred" class="modal fade row-form compart-type" data-backdrop="static" data-keyboard="false" compartmentId={{compartmentId}} compartmentTypeId={{_id}}>

        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title">{{label}}</h4>
                </div>
				<div id="add-new-property-chain-id" class="modal-body multi-field" style="width: 550px">
	                    <form onsubmit="return false;">
						  <div class="table-container">
						  <table id="property-table" class="table table-bordered">
							<thead>
							  <tr>
								<th>Property</th>
								<th style="width: 100px;">IsInverse</th>
								<th style="width: 100px;">Delete</th>
							  </tr>
							</thead>
							<tbody>
							{{#each fields}}

							  <tr>
								<td>
								  <input class="form-control property-select" type="text" name="product" list="productName" autocomplete="off" value="{{Property}}"/>
									<datalist id="productName">

									</datalist>
								</td>
								<td style="text-align: center; vertical-align: middle;">
								  <input
									type="checkbox"
									class="is-inverse-checkbox"
									{{InverseTrue}}
								  />
								</td>
								<td>
								 <button type="button" class="btn btn-sm btn-danger delete-btn">
									<i class="fa fa-trash"></i> Delete
								 </button>
								</td>
							  </tr>
							  {{/each}}

							</tbody>
						  </table>
						  <button id="add-key-row-btn" type="button" class="btn btn-primary">
							<i class="fa fa-plus"></i> Add
						  </button>
						</div>


	                    </form>
	             </div>
                <div class="modal-footer">
                    <button id="cancel-add-new-property-chain-owlgred" type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button id="ok-add-new-property-chain-owlgred" type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
                </div>
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->

    </div><!-- /.modal -->
  {{/with}}
</template>
