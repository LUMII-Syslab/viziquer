
<template name="VQ_DSS_schema">

	<style>
		/* BRP-algorithm tunable sliders: each represents a pair of complementary
		   weights summing to 1. The track is a thick two-colour bar whose split
		   follows the (transparent-track) range input thumb sitting on top. */
		.brp-split-track {
			position: relative;
			width: 100%;
			min-width: 0;
			height: 24px;
			border-radius: 3px;
			background: linear-gradient(to right, #428bca 0 30%, #f0ad4e 30% 100%);
		}
		.brp-split-slider {
			-webkit-appearance: none;
			appearance: none;
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: transparent;
			outline: none;
			padding: 0;
			margin: 0;
			cursor: ew-resize;
			z-index: 1;
		}
		.brp-split-slider::-webkit-slider-runnable-track {
			height: 24px;
			background: transparent;
			border: none;
		}
		.brp-split-slider::-moz-range-track {
			height: 24px;
			background: transparent;
			border: none;
		}
		.brp-split-slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 6px;
			height: 32px;
			border-radius: 2px;
			background: #222;
			border: 1px solid #fff;
			box-shadow: 0 0 3px rgba(0,0,0,0.4);
			margin-top: -4px;
			cursor: ew-resize;
		}
		.brp-split-slider::-moz-range-thumb {
			width: 6px;
			height: 32px;
			border-radius: 2px;
			background: #222;
			border: 1px solid #fff;
			box-shadow: 0 0 3px rgba(0,0,0,0.4);
			cursor: ew-resize;
		}
	</style>

	<!-- Modal for new document -->
    <div id="VQ-DSS-schema" class="modal fade" data-backdrop="static" data-keyboard="false">
      <div class="modal-dialog" style="width:1000px">
        <div class="modal-content">
          <div class="modal-header" style="overflow:scroll;">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            <h4 class="modal-title">DSS schema <b>{{info_schema}}</b> has {{classCountAll}} ({{classCountFiltered}} filtered ) classes and {{propCountAll}} properties.</h4>
          </div>
            {{#if isBig }}
            {{else}}
            {{#if fragmentForm}}
              <ul class="nav nav-tabs" id="vq-tab3" style="padding-top:10px;">
                <li class="active"><a data-toggle="tab" href="#fragment1">Schema fragment</a></li>
                <li><a data-toggle="tab" href="#fragment2">Parameters + properties</a></li>
              </ul>

              <div class="tab-content" style="overflow:auto;">
                <!-- //////////////////////////////////////// -->
                <div id="fragment1" class="tab-pane fade in active">
                  <div class="form-group">
                    <label for="" class="col-sm-2 control-label">Filter</label>
                    <div class="col-sm-10">
                        <input id="filter" type="text" class="form-control" style="width: 200px;" >
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-6">
                        <label>Filtered classes</label>
                      </div>
                      <div class="col-sm-6">
                        <label>Selected classes </label>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="classesF" size="40" multiple aria-label="multiple select 1" style="width: 400px;">
                        {{#each classesF}}
                          <option value="{{id}}" {{selected}}>{{display_name}} </option>
                        {{/each}}
                      </select>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <button id="moveR" type="button" class="btn btn-primary" >&rarr;</button>
                      <button id="moveL" type="button" class="btn btn-primary ">&larr;</button>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="classesFS" size="40" multiple aria-label="multiple select 2" style="width: 400px;">
                        {{#each classesFS}}
                          <option value="{{id}}" {{selected}}>{{display_name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div id="fragment-div2" style="padding-top: 10px;">
                      <label for="fragment-size">Fragment size:</label>
                      <input type="number" id="fragment-size2" name="fragment-size2" value="10" size="5">
                      <label for="fragment-algorithm" style="margin-left: 10px;">Algorithm:</label>
                      <select name="fragment-algorithm" id="fragment-algorithm2">
                        <option value="trivial">Direct</option>
                        <option value="heuristic">Heuristic (greedy)</option>
                        <option value="ppr">Personalized PageRank</option>
                        <option  selected value="limited-ppr">Stepwise PPR</option>
                      </select>
                      <label for="fragment-edge-weight-context" style="margin-left: 10px;">Weight context:</label>
                      <select name="fragment-edge-weight-context" id="fragment-edge-weight-context2">
                        <option value="src-conn">Source class connectivity</option>
                        <option  selected value="src-tgt-conn">Source and target class connectivity</option>
                        <option value="src-size">Source class size</option>
                        <option value="src-tgt-size">Source and target class size</option>
                      </select>
                      <button id="getFragment2" type="button" class="btn btn-primary" style="margin-left: 10px;">Get fragment</button>
                      <!-- Optional. Used to show adj with edge weights to analyze fragment finding algorithms -->
                      <!-- <div id="fragment-relevances">
                        <p id="fragment-ancestor-classes"></p>
                        <ul id="fragment-adj-classes" style="padding-left: 10px;"></ul>
                      </div> -->
                    </div>
                  </div>
                </div>
                <!-- //////////////////////////////////////// -->
                <div id="fragment2" class="tab-pane fade">
                  <label class="form-check-label">
                    <input class="form-check-input" name = "addSupF" id="addSupF" type="checkbox">
                    <span class="custom-checkbox"></span>
                      Add superclasses
                  </label>
                  <label class="form-check-label">
                    <input class="form-check-input" name = "connectAll" id="connectAll" type="checkbox" checked = "checked">
                    <span class="custom-checkbox"></span>
                      Connect all classes
                  </label>
                  <label class="form-check-label">
                    <input class="form-check-input" name = "freeProp" id="freeProp" type="checkbox" checked = "checked">
                    <span class="custom-checkbox"></span>
                      Only orphan properties
                  </label>
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-6">
                        <label>Properties</label>
                      </div>
                      <div class="col-sm-6">
                        <label>Selected properties</label>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="propertiesF" size="40" multiple aria-label="multiple select 1" style="width: 400px;">
                        {{#each propertiesF}}
                          <option value="{{id}}" {{selected}}>{{p_name}} </option>
                        {{/each}}
                      </select>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <button id="propMoveR" type="button" class="btn btn-primary" >&rarr;</button>
                      <button id="propMoveL" type="button" class="btn btn-primary ">&larr;</button>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="propertiesFS" size="40" multiple aria-label="multiple select 2" style="width: 400px;">
                        {{#each propertiesFS}}
                          <option value="{{id}}" {{selected}}>{{p_name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <!-- //////////////////////////////////////// -->
              <!-- //////////////////////////////////////// -->
            {{else}}

              <ul class="nav nav-tabs" id="vq-tab2" style="padding-top:10px;">
                <li class="active"><a data-toggle="tab" href="#VQ-DSS-main">Classes and properties</a></li>
                <li><a data-toggle="tab" href="#parameters">Diagram parameters</a></li>
                <li><a data-toggle="tab" href="#extra2">Extra parameters</a></li>
                {{#if pub}}
                {{else}}
                  <li><a data-toggle="tab" href="#support">Support</a></li>
                {{/if}}
              </ul>

              <div class="tab-content" style="overflow:auto;">
                <!-- //////////////////////////////////////// -->
                <div id="VQ-DSS-main" class="tab-pane fade in active">
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-6">
                        <div class="explain-form-group" style="padding-top:20px;">
                          <span class="label label-default" style="font-size:15px; background-color:transparent;">{{LF_fixedCount}}</span>
                            <label class="form-check-label">
                              <input class="form-check-input" id="fixedCount" name="fixedCount" index = 1 type="checkbox" checked = "checked" >
                              <span class="custom-checkbox"></span>
                                <div class="help-tip">
                                  <p>{{I_fixedCount}} </p>
                                </div>
                            </label>
                        </div>
                        <div class="slidecontainer" style="width: 400px; padding-bottom:10px;">
                          <p><span id="classCount-slider-span"> </span> Classes in the diagram - {{classCountSelected}} from {{classCountForSlider}}</p>
                          <input type="range" min="0" max={{classCountForSlider}} value={{classCountSelected}} class="slider" id="classCount"  {{filterDisabled}}>
                        </div>
                        <select class="form-control" id="sortPar" style="width: 400px;">
                          <option selected value=1 >Sort classes by class weight</option>
                          <option value=3 >Sort classes by count of class individuals</option>
                          <option value=4 >Sort classes by count of incoming triples</option>
                          <option value=2 >Sort classes by namespaces</option>
                        </select>
                        <span>Class weight = (class individuals) + (incoming triples)^(5/6)</span>
                      </div>
                      <div class="col-sm-6">
                        <div class="slidecontainer" style="width: 400px; padding-top:10px;">
                          <p><span id="propCount-slider-span"> </span>. Properties in the diagram - {{propCount}}</p>
                          <input type="range" min="0" max={{propSliderMax}} value={{propSliderSelected}} class="slider" id="propSlider" {{filterDisabled}} >
                        </div>
                        <label class="form-check-label" style="width: 400px; padding-top:10px; padding-bottom:10px;" >
                          <input class="form-check-input" name = "addPropEnds" id="addPropEnds" type="checkbox" >
                          <span class="custom-checkbox"></span>
                          Non-class nodes ({{nonClassPropLabel}})
                          <div class="help-tip">
                            <p>{{I_addPropEnds}} </p>
                          </div>
                        </label>
                        <label>Class name filter:</label>
                        <input id="class_filter" type="text" class="form-control" style="width: 300px;"   {{manualDisabled}} >
                      </div>
                    </div>
                  </div>
                  <div class="explain-form-group" style="padding-top:20px;">

                  </div>
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-6">
                        <label>Selected classes ({{classCountSelected}})</label>
                      </div>
                      <div class="col-sm-6">
                        <label>Remaining classes ({{classCountRest}})</label>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="selectedClasses" size="17" multiple aria-label="multiple select 1" style="width: 400px;">
                        {{#each classes}}
                          <option value="{{id}}" {{selected}}>{{display_name}} </option>
                        {{/each}}
                      </select>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <button id="removeSelected" type="button" class="btn btn-primary"  {{manualDisabled}}>&rarr;</button>
                      <button id="addSelected" type="button" class="btn btn-primary" {{manualDisabled}}>&larr;</button>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="restClasses" size="17" multiple aria-label="multiple select 2" style="width: 400px;">
                        {{#each restClasses}}
                          <option value="{{id}}" {{selected}}>{{display_name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-6">
                        <label>Selected properties ({{propCount}})</label>
                      </div>
                      <div class="col-sm-6">
                        <label>Remaining properties ({{propCountRest}})</label>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="selectedProperties" multiple size="15" style="width: 400px;">
                        {{#each properties}}
                          <option value="{{id}}">{{p_name}} </option>
                        {{/each}}
                      </select>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <button id="removeSelectedProp" type="button" class="btn btn-primary" {{manualDisabled}}>&rarr;</button>
                      <button id="addSelectedProp" type="button" class="btn btn-primary" {{manualDisabled}}>&larr;</button>
                    </div>
                    <div style="display: inline-block; vertical-align:top;">
                      <select class="form-select" id="restProperties" multiple size="15"  style="width: 400px;">
                        {{#each restProperties}}
                          <option value="{{id}}">{{p_name}}</option>
                        {{/each}}
                      </select>
                    </div>
                  </div>
                  <div style="display: flex; align-items: center; margin-left: 10px; margin-top: 10px; margin-right: 15px;">
                    <button id="hideFragment" type="button" class="btn btn-primary" {{manualDisabled}}>Fragment computation options</button>
                    {{#if showFragmentBlock}}
                    <div style="display: flex; align-items: center; gap: 10px; margin-left: auto;">
                        {{#if showCentralityButton}}
                        <button id="calculateRelevance" type="button" class="btn btn-default">{{#if centralityApplied}}Hide BRP Score{{else}}Calculate BRP Score{{/if}}</button>
                        {{/if}}
                        <button id="getFragment" type="button" class="btn btn-primary">Get fragment</button>
                    </div>
                    {{/if}}
                </div>
                  {{#if showFragmentBlock}}
                    <div id="fragment-div" style="padding-top: 10px; padding-bottom: 10px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px;">
                      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0;">
                        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
                          <label for="fragment-size" style="margin-left: 10px;">Fragment size:</label>
                          <input type="number" id="fragment-size" name="fragment-size" value="10" size="5">
                          <label for="fragment-algorithm" style="margin-left: 10px;">Algorithm:</label>
                          <select name="fragment-algorithm" id="fragment-algorithm">
                            <option value="trivial">Direct</option>
                            <option value="heuristic">Heuristic (greedy)</option>
                            <option value="ppr">Personalized PageRank</option>
                            <option selected value="limited-ppr">Stepwise PPR</option>
                            <option value="brp">BRP centrality</option>
                          </select>
                          <span id="fragment-weight-context-wrap">
                            <label for="fragment-edge-weight-context" style="margin-left: 10px;">Weight context:</label>
                            <select name="fragment-edge-weight-context" id="fragment-edge-weight-context">
                              <option value="src-conn">Source class connectivity</option>
                              <option selected value="src-tgt-conn">Source and target class connectivity</option>
                              <option value="src-size">Source class size</option>
                              <option value="src-tgt-size">Source and target class size</option>
                            </select>
                          </span>
                        </div>
                        <div id="fragment-brp-sliders" style="display: none; grid-template-columns: 100px max-content 1fr max-content 100px; column-gap: 8px; row-gap: 12px; align-items: center; padding: 0 10px; width: 100%; box-sizing: border-box;">
                          <label for="brp-cw-incoming" style="text-align: right; margin-bottom: 0; line-height: 1.2;">Incoming Class Weight</label>
                          <span id="brp-cw-incoming-val" style="font-variant-numeric: tabular-nums; text-align: right; min-width: 24px;">0.3</span>
                          <div class="brp-split-track">
                            <input type="range" id="brp-cw-incoming" class="brp-split-slider" min="0" max="1" step="0.1" value="0.3">
                          </div>
                          <span id="brp-cw-outgoing-val" style="font-variant-numeric: tabular-nums; text-align: left; min-width: 24px;">0.7</span>
                          <label style="text-align: left; margin-bottom: 0; line-height: 1.2;">Outgoing Class Weight</label>

                          <label for="brp-pw-standart" style="text-align: right; margin-bottom: 0; line-height: 1.2;">Standard Property Weight</label>
                          <span id="brp-pw-standart-val" style="font-variant-numeric: tabular-nums; text-align: right; min-width: 24px;">0.0</span>
                          <div class="brp-split-track">
                            <input type="range" id="brp-pw-standart" class="brp-split-slider" min="0" max="1" step="0.1" value="0.3">
                          </div>
                          <span id="brp-pw-user-val" style="font-variant-numeric: tabular-nums; text-align: left; min-width: 24px;">0.7</span>
                          <label style="text-align: left; margin-bottom: 0; line-height: 1.2;">User-Defined Property Weight</label>

                          <label for="brp-beta" style="text-align: right; margin-bottom: 0; line-height: 1.2;">Centrality Measure Weight</label>
                          <span id="brp-beta-val" style="font-variant-numeric: tabular-nums; text-align: right; min-width: 24px;">0.7</span>
                          <div class="brp-split-track">
                            <input type="range" id="brp-beta" class="brp-split-slider" min="0" max="1" step="0.1" value="0.7">
                          </div>
                          <span id="brp-alpha-val" style="font-variant-numeric: tabular-nums; text-align: left; min-width: 24px;">0.3</span>
                          <label style="text-align: left; margin-bottom: 0; line-height: 1.2;">Closeness Measure Weight</label>

                        </div>
                      </div>
                      <span id="fragment-std-prop-wrap" style="display: none; margin-left: 10px; align-items: flex-start; gap: 6px;">
                        <label style="white-space: nowrap;">Standard properties:</label>
                        <div id="fragment-std-prop-list" style="max-height: 160px; overflow: auto; border: 1px solid #ccc; padding: 4px 8px 16px; width: 240px;"></div>
                        <div style="display: flex; flex-direction: column; gap: 4px; align-self: flex-start;">
                          <button id="editStandardProps" type="button" class="btn btn-default">Edit standard properties</button>
                          <input class="form-control" id="stdPropSearch" type="text" autocomplete="off" placeholder="Search.." style="display: none; width: 160px;">
                          <div id="stdPropHelpText" style="display: none; max-width: 160px; font-size: 12px; color: #666; line-height: 1.2;">Click on a property to add/remove it from the standard property list.</div>
                        </div>
                      </span>
                      <!-- Optional. Used to show adj with edge weights to analyze fragment finding algorithms -->
                      <!-- <div id="fragment-relevances">
                        <p id="fragment-ancestor-classes"></p>
                        <ul id="fragment-adj-classes" style="padding-left: 10px;"></ul>
                      </div> -->
                    </div>
                    <div id="fragment-brp-options" style="display: none; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px 0;">
                      <label style="margin-bottom: 0;">Edges in triples:</label>
                      <select id="brp-edgesInTriples">
                        <option value="true" selected>Yes</option>
                        <option value="false">No</option>
                      </select>
                      <span id="brp-cntTransform-wrap" style="display: inline-flex; align-items: center; gap: 8px;">
                        <label style="margin-bottom: 0;">Count transform:</label>
                        <select id="brp-cntTransform">
                          <option value="log10">log&#x2081;&#x2080;</option>
                          <option value="log2">log&#x2082;</option>
                          <option value="sqrt">sqrt</option>
                          <option value="full" selected>full</option>
                        </select>
                      </span>
                      <label style="margin-bottom: 0;">Use class instance count:</label>
                      <select id="brp-useInstanceCount">
                        <option value="false">No</option>
                        <option value="true" selected>Yes</option>
                      </select>
                      <label style="margin-bottom: 0;">Closeness mode:</label>
                      <select id="brp-closenessMode">
                        <option value="centralityBased" selected>Centrality-based</option>
                        <option value="weightBased">Weight-based</option>
                        <option value="unweighted">Unweighted</option>
                      </select>
                    </div>
                  {{/if}}
                </div>
                <!-- //////////////////////////////////////// -->
                <div id="parameters" class="tab-pane fade">
                  <div class="container-fluid">
                    <div class="row">
                      <div class="col-sm-4">
                        <div class="slidecontainer" style="padding-bottom:10px; padding-top:10px;">
                          <p><span id="classCount-slider-span2"> </span> Classes in the diagram - {{classCountSelected}} from {{classCountForSlider}}</p>
                          <input type="range" min="0" max={{classCountForSlider}} value={{classCountSelected}} class="slider" id="classCount2"  {{filterDisabled}}>
                        </div>
                        <div class="form-group">
                          <label for="diffG" class="col-sm-3 control-label" >Merging strength:</label>
                          <div class="col-sm-9">
                            <select class="form-control" id="diffG" >
                              <option value=0 >Without merging</option>
                              <option value=1 >Equivalent classes</option>
                              <option value=2 >Weak (2)</option>
                              <option selected value=5 >Basic (5)</option>
                              <option value=10 >Strong (10)</option>
                              <option value=20 >Strong (20)</option>
                            </select>
                          </div>
                        </div>
                        <div class="form-group">
                          <label > </label>
                        </div>
                        <div class="form-group">
                          <div class="col-sm-6">
                            <button id="showGroups" type="button" class="btn btn-primary" >Compute nodes</button>
                          </div>
                          <div class="col-sm-6">
                            <button id="makeDiagrAJOO2a" type="button" class="btn btn-primary" data-dismiss="modal" {{hasClasses}}>Create Diagram</button>
                          </div>
                        </div>
                        {{#if pub}}
                        {{else}}
                          <button id="showClasses" type="button" class="btn btn-primary">Show basic classes</button>
                        {{/if}}
                      </div>
                      <div class="col-sm-4">
                        <div class="slidecontainer" style=" padding-top:10px;">
                          <p><span id="propCount-slider-span2"> </span>. Properties - {{propCount}}</p>
                          <input type="range" min="0" max={{propSliderMax}} value={{propSliderSelected}} class="slider" id="propSlider2" {{filterDisabled}} >
                        </div>
                        <label class="form-check-label" style=" padding-top:5px;" >
                          <input class="form-check-input" name = "abstr" id="abstr" type="checkbox">
                          <span class="custom-checkbox"></span>
                          Make abstract superclasses
                        </label>
                        <label class="form-check-label" style=" padding-top:5px;">
                          <input class="form-check-input" name = "addSup" id="addSup" type="checkbox" checked = "checked">
                          <span class="custom-checkbox"></span>
                          Add fragment superclasses to diagram
                        </label>
                        <label class="form-check-label" style=" padding-top:5px;">
                          <input class="form-check-input" name = "cover" id="cover" type="checkbox" checked = "checked">
                          <span class="custom-checkbox"></span>
                          Use pre-computed property ascription point
                        </label>
                        <label class="form-check-label" style=" padding-top:5px;">
                          <input class="form-check-input" name = "showIntersect" id="showIntersect" type="checkbox">
                          <span class="custom-checkbox"></span>
                          Connect intersecting classes
                        </label>
                      </div>
                      <div class="col-sm-4">
                        <label style="width:300px; padding-top:30px;"> Show properties as lines, if: </label>
                        <div class="row">
                          <div class="col-sm-8">
                            <label style=" padding-top:5px;">Lines with property no more than: </label>
                            <label style=" padding-top:5px;">Triple count at least:</label>
                            <label style=" padding-top:5px;">Triple count at least % of class:</label>
                            <label style=" padding-top:10px; ">Brief property lists:</label>
                            <div class="help-tip">
                              <p>{{I_pList}} </p>
                            </div>
                          </div>
                          <div class="col-sm-4">
                            <input type="number" id="pMaxCount" name="pMaxCount" value="7" style="width:50px; padding-top:5px;" >
                            <div class="help-tip">
                              <p>{{I_pMaxCount}} </p>
                            </div>
                            <input type="number" id="pMinSize" name="pMinSize" value="1" style="width:50px; padding-top:10px;" >
                            <div class="help-tip">
                              <p>{{I_pMinSize}} </p>
                            </div>
                            <input type="number" id="pEssential" name="pEssential" value="0" style="width:50px; padding-top:10px; padding-bottom:10px ;" >
                            <select class="form-control" id="pList" style="width:100%; margin: 0; padding: 0;" >
                              <option value=2 >Strong</option>
                              <option selected value=1 >Medium</option>
                              <option value=0 >No</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid" style=" padding-top:10px;">
                    <span class="label label-default" style="font-size:15px; background-color:transparent; padding-left:0px;">Nodes- {{classCountUsed}}, groups - {{classCountGroups}}, abstract classes - {{classCountAbstr}}, lines - {{linesCount}} </span>
                  </div>
                  <div class="container-fluid" style="padding-top:10px;">
                    <div class="row">
                      <div class="col-sm-4">
                        <label>C-Class, M-Merged classes, A-Superclass</label>
                        <div style="display: inline-block; vertical-align:top;">
                          <select class="form-select" id="usedClasses" size="33"  style="width: 300px;">
                            {{#each usedClasses}}
                              <option value={{id}} {{selected}}> {{display_name}} </option>
                            {{/each}}
                          </select>
                        </div>
                      </div>
                      <div class="col-sm-4">
                        <label>Class/Class+Subclasses</label>
                        <div style="display: inline-block; vertical-align:top;">
                          <select class="form-select" id="subClasses" size="33"  style="width: 300px;">
                            {{#each subClasses}}
                              <option value={{id}} {{selected}}>{{display_name}}</option>
                            {{/each}}
                          </select>
                        </div>
                      </div>
                      <div class="col-sm-4">
                        <label>Properties</label>
                        <div style="display: inline-block; vertical-align:top;">
                          <select class="form-select" id="classProperties" size="33" multiple style="width: 300px;">
                            {{#each classProperties}}
                              <option value={{id}} {{selected}}>{{display_name}}</option>
                            {{/each}}
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- //////////////////////////////////////// -->
                <div id="extra2" class="tab-pane fade">
                  <div class="col-sm-4" style="padding-top:10px;">
                    <div style="padding-bottom:10px;">
                      <span class="label label-default" style="font-size:15px; background-color:transparent;">Diagram parameters:</span>
                    </div>
                        {{#if pub}}
                        {{else}}
                        <label class="form-check-label" style="padding-top:10px;">
                          <input class="form-check-input" name = "compClassView" id="compClassView" type="checkbox" checked = "checked">
                          <span class="custom-checkbox"></span>
                          Compact view of properties
                        </label>
                        {{/if}}
                        <label class="form-check-label">
                          <input class="form-check-input" name = "compView" id="compView" type="checkbox" checked = "checked">
                          <span class="custom-checkbox"></span>
                          Compact list of property target classes
                        </label>
                        <label class="form-check-label" style="padding-top:10px;">
                          <input class="form-check-input" name = "duplicate" id="duplicate" type="checkbox" >
                          <span class="custom-checkbox"></span>
                          Duplicate non class links in attributes
                        </label>
                        <div style="padding-bottom:10px; padding-top:10px;">
                          <span class="label label-default" style="font-size:15px; background-color:transparent;">Grouping extra parameter:</span>
                        </div>
                        <label >Size factor:</label>
                        <div class="help-tip">
                          <p>{{I_pw}} </p>
                        </div>
                        <select class="form-control" id="pw" style="width:300px" >
                          <option value=0 >power = 0 </option>
                          <option value=3 >power = 1/3 </option>
                          <option selected value=5 >power =  1/5 </option>
                        </select>
                        <label style=" padding-top:10px;">Target merging:</label>
                        <select class="form-control" id="diffT" style="width:300px;" >
                          <option selected value=0 >Basic (sim > 0)</option>
                          <option value=1 >Weak (sim > 1)</option>
                          <option value=2 >Weak (sim > 2)</option>
                        </select>
                        {{#if pub}}
                        {{else}}
                          <select class="form-control" id="kValue" style="width:300px;">
                            <option selected value=1 > dw(A,B)/(sw(A,B)+ε) &lt; 1 </option>
                            <option value=2 > dw(A,B)/(sw(A,B)+ε) &lt; 2 </option>
                            <option value=3 > dw(A,B)/(sw(A,B)+ε) &lt; 3 </option>
                            <option value=5 > dw(A,B)/(sw(A,B)+ε) &lt; 5 </option>
                            <option value=10 > dw(A,B)/(sw(A,B)+ε) &lt; 10 </option>
                          </select>
                          <label class="form-check-label">
                            <input class="form-check-input" name = "odlDifs" id="aldDifs" type="checkbox">
                            <span class="custom-checkbox"></span>
                            Old diffs
                          </label>
                        {{/if}}
                  </div>
                  {{#if pub}}
                  {{else}}
                  <div class="col-sm-4" style="padding-top:10px;">
                    <div style="padding-bottom:10px; padding-top:10px;">
                      <span class="label label-default" style="font-size:15px; background-color:transparent;">Hide classes from:</span>
                    </div>
                    <select class="form-select" id="Cl_NS" size="17" multiple aria-label="multiple select 2" {{filterDisabled}} style="width: 300px;">
                      {{#each cl_ns}}
                        <option value="{{name}}" {{selected}}>{{display_name_cl}}</option>
                      {{/each}}
                    </select>
                    <div style="padding-bottom:10px; padding-top:10px;">
                      <span class="label label-default" style="font-size:15px; background-color:transparent;">Exclude properties from:</span>
                    </div>
                    <select class="form-select" id="Prop_NS" size="17" multiple aria-label="multiple select 2" style="width: 300px;">
                      {{#each prop_ns}}
                        <option value="{{name}}" {{selected}}>{{display_name_prop}}</option>
                      {{/each}}
                    </select>
                  </div>
                  <div class="col-sm-4" style="padding-top:10px;">
                    <div style="padding-bottom:10px; padding-top:10px;">
                      <span class="label label-default"  style="font-size:15px; background-color:transparent;">Selected classes ({{classCountSelected}})</span>
                    </div>
                    <select class="form-select" id="ShowSelectedClasses" size="17" multiple aria-label="multiple select 2" disabled style="width: 300px;">
                      {{#each classes}}
                        <option value="{{id}}" {{selected}}>{{display_name}}</option>
                      {{/each}}
                    </select>
                  </div>
                  {{/if}}
                </div>
                <!-- //////////////////////////////////////// -->
                <div id="support" class="tab-pane fade">
                  <label class="form-check-label">
                  <input class="form-check-input" name = "addIds" id="addIds" type="checkbox">
                  <span class="custom-checkbox"></span>
                    Show DB IDs in names
                  </label>
                  <label class="form-check-label">
                    <input class="form-check-input" name = "onlyOrphan" id="onlyOrphan" type="checkbox" checked = "checked">
                    <span class="custom-checkbox"></span>
                      Only orphan properties
                  </label>
                  <div class="form-group">
                    <button id="calck" type="button" class="btn btn-primary">Test</button>
                  </div>
                  <div class="form-group">
                    <button id="getProperties" type="button" class="btn btn-primary" >Show all properties</button>
                  </div>
                </div>
              </div>
              {{/if}}
              <!-- //////////////////////////////////////// -->
              <!-- //////////////////////////////////////// -->
            {{/if}}

          <div class="modal-footer" style="clear: both;">

					  {{else}}
              {{#if fragmentForm}}

                <button id="makeDiagrAJOOProperties" type="button" class="btn btn-primary" data-dismiss="modal" {{hasFragment}}>Create Property diagram</button>
              {{else}}
                <button id="makeDiagrAJOO2" type="button" class="btn btn-primary" data-dismiss="modal" {{hasClasses}}>Create Schema diagram</button>
              {{/if}}
              {{#if pub}}
              {{else}}
						    <button id="makeDiagr" type="button" class="btn btn-primary" data-dismiss="modal" {{hasClasses}}>Export Schema diagram data (old)</button>
              {{/if}}
					  {{/if}}
            <button id="cancel-VQ-DSS-schema" type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          </div>

        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->

    </div><!-- /.modal -->
